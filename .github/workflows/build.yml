name: Build & Release

on:
  push:
    branches: [ main, vs ]
    tags: [ 'v*' ]          # 推送 v 开头的 tag（如 v1.0.0）时自动发布 Release
  pull_request:
  workflow_dispatch:         # 允许手动触发

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 5.6.3 and MinGW 4.9.2
        timeout-minutes: 12
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Qt563'
          $installer = Join-Path $env:RUNNER_TEMP 'qt563.exe'
          curl.exe --fail --location --retry 3 --connect-timeout 20 --max-time 300 --silent --show-error -o $installer https://download.qt.io/archive/qt/5.6/5.6.3/qt-opensource-windows-x86-mingw492-5.6.3.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt installer download failed' }
          $control = Join-Path $env:RUNNER_TEMP 'qt-install.qs'
          @"
          function Controller() {
            installer.autoRejectMessageBoxes();
            installer.setValue("TargetDir", "$($root.Replace('\','/'))");
          }
          Controller.prototype.CredentialsPageCallback = function() { gui.clickButton(buttons.SkipButton); }
          Controller.prototype.IntroductionPageCallback = function() { gui.clickButton(buttons.NextButton); }
          Controller.prototype.TargetDirectoryPageCallback = function() { gui.clickButton(buttons.NextButton); }
          Controller.prototype.ComponentSelectionPageCallback = function() {
            gui.currentPageWidget().selectAll();
            gui.clickButton(buttons.NextButton);
          }
          Controller.prototype.LicenseAgreementPageCallback = function() {
            gui.currentPageWidget().AcceptLicenseRadioButton.checked = true;
            gui.clickButton(buttons.NextButton);
          }
          Controller.prototype.StartMenuDirectoryPageCallback = function() { gui.clickButton(buttons.NextButton); }
          Controller.prototype.ReadyForInstallationPageCallback = function() { gui.clickButton(buttons.NextButton); }
          Controller.prototype.FinishedPageCallback = function() {
            var page = gui.currentPageWidget();
            if (page.RunItCheckBox) page.RunItCheckBox.checked = false;
            gui.clickButton(buttons.FinishButton);
          }
          "@ | Set-Content $control
          Write-Host "Starting Qt offline installer"
          $installerLog = Join-Path $env:RUNNER_TEMP "qt-installer.log"
          $process = Start-Process $installer -RedirectStandardOutput $installerLog -ArgumentList @('--verbose', '--script', "`"$control`"") -WindowStyle Hidden -PassThru
          if (!$process.WaitForExit(300000)) { $process.Kill(); Get-Content $installerLog -Tail 80; throw "Qt installer timed out" }
          Get-Content $installerLog -Tail 30
          if ($process.ExitCode -ne 0) { throw "Qt installer exited with $($process.ExitCode)" }
          $qt = Join-Path $root '5.6.3/mingw49_32'
          $gcc = Get-ChildItem "$root/Tools" -Recurse -Filter g++.exe | Select-Object -First 1
          if (!(Test-Path "$qt/bin/qmake.exe") -or !$gcc) { throw 'Qt or MinGW was not installed' }
          "QT_ROOT_DIR=$qt" >> $env:GITHUB_ENV
          $gcc.DirectoryName >> $env:GITHUB_PATH
          "$qt/bin" >> $env:GITHUB_PATH

      - name: Configure (CMake, MinGW Makefiles)
        run: >
          cmake -S . -B build -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_SH="CMAKE_SH-NOTFOUND"

      - name: Build (Release)
        run: cmake --build build --config Release -- -j

      # 收集可执行文件 + windeployqt/Poppler 复制进来的运行时
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\NGPrinter.exe dist\
          Copy-Item build\*.dll dist\ -ErrorAction SilentlyContinue
          foreach ($d in 'platforms','imageformats','iconengines','bearer','printsupport','styles','translations') {
            if (Test-Path "build\$d") { Copy-Item "build\$d" dist\ -Recurse -Force }
          }
          Compress-Archive -Path dist\* -DestinationPath NGPrinter-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGPrinter-windows
          path: dist/

      # 仅当推送的是 tag 时，创建 GitHub Release 并附带 zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NGPrinter-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
