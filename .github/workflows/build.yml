name: Build & Release

on:
  push:
    branches: [ main, vs ]
    tags: [ 'v*' ]          # 推送 v 开头的 tag（如 v1.0.0）时自动发布 Release
  pull_request:
  workflow_dispatch:         # 允许手动触发

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Qt 5.6.3 and MinGW 4.9.2
        timeout-minutes: 12
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'Qt563'
          $installer = Join-Path $env:RUNNER_TEMP 'qt563.exe'
          curl.exe --fail --location --retry 2 --connect-timeout 20 --max-time 300 --silent --show-error -o $installer https://download.qt.io/archive/qt/5.6/5.6.3/qt-opensource-windows-x86-mingw492-5.6.3.exe
          if ($LASTEXITCODE -ne 0) { throw 'Qt installer download failed' }
          # Read the Qt Installer Framework component index and extract only the two required components.
          @'
          import mmap
          import pathlib
          import struct
          import subprocess
          import sys

          installer, root = map(pathlib.Path, sys.argv[1:])
          components = {
              "qt.563.win32_mingw49": root / "qt",
              "qt.tools.win32_mingw492": root / "mingw",
          }
          root.mkdir(parents=True, exist_ok=True)
          with installer.open("rb") as source, mmap.mmap(source.fileno(), 0, access=mmap.ACCESS_READ) as data:
              cookie = bytes.fromhex("f868d6991c0a63c2")
              end = data.rfind(cookie, max(0, len(data) - 2**20)) + len(cookie)
              if end <= len(cookie):
                  raise ValueError("Qt installer footer was not found")
              metadata_count, content_size = struct.unpack_from("<qq", data, end - 32)
              base = end - content_size
              index_offset, _ = struct.unpack_from("<qq", data, end - 32 - 16 * (metadata_count + 2))

              def read_entries(offset):
                  count, = struct.unpack_from("<q", data, offset)
                  offset += 8
                  for _ in range(count):
                      length, = struct.unpack_from("<q", data, offset)
                      offset += 8
                      name = data[offset:offset + length].decode("utf-8")
                      offset += length
                      start, size = struct.unpack_from("<qq", data, offset)
                      offset += 16
                      yield name, base + start, size

              found = set()
              for component, start, _ in read_entries(base + index_offset):
                  if component not in components:
                      continue
                  found.add(component)
                  for name, archive_start, size in read_entries(start):
                      if not name.endswith(".7z"):
                          continue
                      archive = root / pathlib.Path(name).name
                      with archive.open("wb") as output:
                          for offset in range(archive_start, archive_start + size, 2**20):
                              output.write(data[offset:min(offset + 2**20, archive_start + size)])
                      subprocess.run(["7z", "x", "-y", "-bso0", f"-o{components[component]}", str(archive)], check=True)
                      archive.unlink()
              if found != components.keys():
                  raise ValueError(f"Qt installer components missing: {components.keys() - found}")
          '@ | python - $installer $root
          if ($LASTEXITCODE -ne 0) { throw 'Qt extraction failed' }
          $qmake = Get-ChildItem "$root/qt" -Recurse -Filter qmake.exe | Select-Object -First 1
          $gcc = Get-ChildItem "$root/mingw" -Recurse -Filter g++.exe | Select-Object -First 1
          if (!$qmake -or !$gcc) { throw 'Qt or MinGW binaries were not found' }
          $qt = Split-Path $qmake.DirectoryName -Parent
          "[Paths]`nPrefix=.." | Set-Content (Join-Path $qmake.DirectoryName 'qt.conf')
          "QT_ROOT_DIR=$qt" >> $env:GITHUB_ENV
          $gcc.DirectoryName >> $env:GITHUB_PATH
          $qmake.DirectoryName >> $env:GITHUB_PATH

      - name: Configure (CMake, MinGW Makefiles)
        run: >
          cmake -S . -B build -G "MinGW Makefiles"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_SH="CMAKE_SH-NOTFOUND"

      - name: Build (Release)
        run: cmake --build build --config Release -- -j

      # 收集可执行文件 + windeployqt/Poppler 复制进来的运行时
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\NGPrinter.exe dist\
          Copy-Item build\*.dll dist\ -ErrorAction SilentlyContinue
          foreach ($d in 'platforms','imageformats','iconengines','bearer','printsupport','styles','translations') {
            if (Test-Path "build\$d") { Copy-Item "build\$d" dist\ -Recurse -Force }
          }
          Compress-Archive -Path dist\* -DestinationPath NGPrinter-windows.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NGPrinter-windows
          path: dist/

      # 仅当推送的是 tag 时，创建 GitHub Release 并附带 zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NGPrinter-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
